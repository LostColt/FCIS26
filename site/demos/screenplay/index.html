<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prose to screenplay</title>
  <link rel="stylesheet" href="../../css/fonts.css">
  <link rel="stylesheet" href="screenplay.css">
  <script>if (window.top !== window.self) document.documentElement.classList.add("embedded");</script>
  <style>html.embedded a[href*="index.html"] { display: none; }</style>
</head>
<body>
  <header class="top-bar">
    <div class="bar-inner">
      <div class="title-group">
        <h1 class="page-title">Prose to screenplay</h1>
        <span class="page-sub">Invented example passages</span>
      </div>

      <div class="scene-picker" role="group" aria-label="Example passages">
        <button type="button" class="scene-btn is-active" data-scene="counseling">Essay conference</button>
        <button type="button" class="scene-btn" data-scene="faculty">Faculty workroom</button>
        <button type="button" class="scene-btn" data-scene="diner">Late-night diner</button>
      </div>
    </div>
  </header>

  <main class="studio-main" id="studio-workspace">
    <div class="studio-columns">
      <section class="prose-column" aria-labelledby="prose-heading">
        <h2 class="column-heading" id="prose-heading">Natural prose</h2>
        <div class="prose-list" id="prose-beats" role="region" aria-label="Prose paragraphs"></div>
      </section>

      <section class="script-column" aria-labelledby="script-heading">
        <h2 class="column-heading" id="script-heading">Screenplay page</h2>
        <article class="script-sheet" id="script-sheet" aria-label="Formatted screenplay">
          <div class="script-blocks" id="script-blocks"></div>
        </article>
      </section>
    </div>
  </main>

  <footer class="quiet-footer">
    <span>Mockup with invented data. Nothing is saved.</span>
    <div class="footer-actions">
      <button type="button" class="text-btn" id="reset-btn">Reset</button>
      <a href="../../index.html#15" class="back-link">Back to the talk</a>
    </div>
  </footer>

  <script src="screenplay.js"></script>
</body>
</html>
