<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afternoon conferences</title>
  <link rel="stylesheet" href="../../css/fonts.css">
  <link rel="stylesheet" href="tracker.css">
  <script>if (window.top !== window.self) document.documentElement.classList.add("embedded");</script>
  <style>html.embedded a[href*="index.html"] { display: none; }</style>
</head>
<body>
  <header class="schedule-bar">
    <div class="schedule-inner">
      <span class="schedule-label">Tuesday afternoon</span>
      <nav class="schedule-strip" id="schedule-strip" aria-label="Afternoon meetings"></nav>
      <button type="button" class="next-btn" id="next-meeting-btn">Next student →</button>
    </div>
  </header>

  <main class="workspace" id="workspace">
    <div class="student-header">
      <h1 class="student-name" id="detail-name"></h1>
      <p class="student-meta" id="detail-schools"></p>
    </div>

    <section class="prep-card" aria-labelledby="prep-heading">
      <h2 class="section-heading" id="prep-heading">Before the meeting</h2>
      <p class="prep-focus" id="detail-prep-focus"></p>
      <div class="prep-checklist" id="detail-checklist" role="group" aria-label="Meeting checklist"></div>
    </section>

    <div class="columns">
      <section class="draft-column" aria-labelledby="draft-heading">
        <div class="column-header">
          <h2 class="section-heading" id="draft-heading">Essay draft</h2>
          <div class="draft-tabs" id="draft-tabs" role="tablist" aria-label="Draft versions"></div>
        </div>
        <blockquote class="draft-excerpt" id="draft-excerpt"></blockquote>
        <p class="draft-note" id="draft-takeaway"></p>
      </section>

      <section class="notes-column" aria-labelledby="notes-heading">
        <h2 class="section-heading" id="notes-heading">Meeting notes</h2>
        <form class="note-form" id="note-form">
          <label for="note-input" class="sr-only">Add a note</label>
          <textarea id="note-input" rows="2" placeholder="Write a quick note before the next student knocks..."></textarea>
          <button type="submit" class="save-note-btn">Add note</button>
        </form>
        <ul class="notes-list" id="notes-timeline" aria-label="Past notes"></ul>
      </section>
    </div>
  </main>

  <footer class="quiet-footer">
    <span>Mockup with invented data. Nothing is saved.</span>
    <div class="footer-actions">
      <button type="button" class="text-btn" id="reset-btn">Reset</button>
      <a href="../../index.html#tracker" class="back-link">Back to the talk</a>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="tracker.js"></script>
</body>
</html>
