<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio reader</title>
  <link rel="stylesheet" href="../../css/fonts.css">
  <link rel="stylesheet" href="reader.css">
</head>
<body data-paper="cream">
  <header class="reader-bar">
    <div class="bar-inner">
      <div class="transport-left">
        <button type="button" class="play-btn" id="play-pause-btn" aria-pressed="false">
          Read aloud
        </button>

        <div class="pace-control">
          <label for="speed-select" class="control-label">Pace</label>
          <select id="speed-select" class="simple-select">
            <option value="0.85">Slow</option>
            <option value="1" selected>Normal</option>
            <option value="1.15">Brisk</option>
          </select>
        </div>
      </div>

      <div class="bar-right">
        <div class="passage-tabs" role="group" aria-label="Reading passages">
          <button type="button" class="sample-btn is-active" data-sample="biology">Biology handout</button>
          <button type="button" class="sample-btn" data-sample="history">Federalist No. 10</button>
          <button type="button" class="sample-btn" data-sample="essay">Student essay</button>
          <button type="button" class="sample-btn" data-sample="custom">Paste text</button>
        </div>

        <details class="settings-menu" id="settings-menu">
          <summary class="settings-trigger">Settings</summary>
          <div class="settings-popover">
            <div class="setting-row">
              <span class="control-label">Paper</span>
              <div class="tint-group" role="group" aria-label="Paper color">
                <button type="button" class="swatch-btn is-active" data-tint="cream">Cream</button>
                <button type="button" class="swatch-btn" data-tint="sage">Sage</button>
                <button type="button" class="swatch-btn" data-tint="warm">Warm</button>
              </div>
            </div>

            <div class="setting-row">
              <label for="voice-select" class="control-label">Voice</label>
              <select id="voice-select" class="simple-select">
                <option value="">Default voice</option>
              </select>
            </div>

            <div class="setting-row">
              <label class="dim-check">
                <input type="checkbox" id="focus-toggle">
                <span>Dim surrounding sentences</span>
              </label>
            </div>
          </div>
        </details>
      </div>
    </div>
  </header>

  <section class="paste-drawer" id="paste-drawer" hidden aria-label="Paste your own text">
    <div class="drawer-inner">
      <label for="custom-text-input" class="sr-only">Paste text to read aloud</label>
      <textarea id="custom-text-input" rows="3" placeholder="Paste a paragraph here..."></textarea>
      <div class="drawer-actions">
        <button type="button" class="action-btn" id="load-custom-btn">Read this text</button>
        <button type="button" class="text-btn" id="close-drawer-btn">Cancel</button>
      </div>
    </div>
  </section>

  <main class="reading-stage" id="reading-stage">
    <article class="reading-column" aria-labelledby="doc-title">
      <header class="doc-header">
        <h1 class="doc-title" id="doc-title"></h1>
        <span class="doc-progress" id="doc-progress"></span>
      </header>
      <div class="sentences-flow" id="sentences-flow" role="region" aria-label="Reading text"></div>
    </article>
  </main>

  <footer class="quiet-footer">
    <span>Mockup with invented data. Nothing is saved.</span>
    <div class="footer-actions">
      <button type="button" class="text-btn" id="reset-btn">Reset</button>
      <a href="../../index.html#19" class="back-link">Back to the talk</a>
    </div>
  </footer>

  <script src="reader.js"></script>
</body>
</html>
