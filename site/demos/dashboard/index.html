<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senior essay caseload</title>
  <link rel="stylesheet" href="../../css/fonts.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header class="board-header">
    <div class="header-inner">
      <div class="title-group">
        <h1 class="page-title">152 seniors</h1>
        <span class="page-sub">Five days until November 1 Early Action</span>
      </div>
      <div class="cohort-filter" role="group" aria-label="Deadline group">
        <button type="button" class="filter-btn is-active" data-cohort="all">All (152)</button>
        <button type="button" class="filter-btn" data-cohort="Nov 1">Nov 1 Early (64)</button>
        <button type="button" class="filter-btn" data-cohort="Nov 15">Nov 15 (38)</button>
        <button type="button" class="filter-btn" data-cohort="Jan 1">Jan 1 Regular (50)</button>
      </div>
    </div>
  </header>

  <main class="board-main" id="main-board">
    <section class="map-column" aria-labelledby="map-heading">
      <div class="map-top">
        <h2 class="section-heading" id="map-heading">Every student</h2>
        <div class="stage-key" id="stage-key" role="group" aria-label="Essay stage key"></div>
      </div>

      <div class="waffle-grid" id="waffle-grid" role="grid" aria-label="152 student tiles"></div>

      <div class="student-strip" id="inspector-card" aria-live="polite">
        <div class="strip-info">
          <div class="strip-title-row">
            <h3 class="strip-name" id="insp-name"></h3>
            <span class="strip-meta" id="insp-meta"></span>
          </div>
          <p class="strip-topic" id="insp-topic"></p>
        </div>
        <div class="strip-actions">
          <button type="button" class="action-btn" id="insp-checkin-btn">Checked in today</button>
          <button type="button" class="action-btn" id="insp-advance-btn">Move to next stage</button>
        </div>
      </div>
    </section>

    <aside class="nudge-column" aria-labelledby="nudge-heading">
      <h2 class="section-heading" id="nudge-heading">Who needs a nudge</h2>
      <ul class="nudge-list" id="triage-list" aria-label="Students not seen recently"></ul>
    </aside>
  </main>

  <footer class="quiet-footer">
    <span>Mockup with invented data. Nothing is saved.</span>
    <div class="footer-actions">
      <button type="button" class="text-btn" id="reset-btn">Reset</button>
      <a href="../../index.html#15" class="back-link">Back to the talk</a>
    </div>
  </footer>

  <script src="dashboard.js"></script>
</body>
</html>
