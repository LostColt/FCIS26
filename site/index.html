<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stop Subscribing, Start Building</title>
  <meta name="description" content="A teacher's story about building the classroom tools he needed instead of subscribing to them, with a workshop and step-by-step guides. FCIS.">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/deck.css">
  <link rel="stylesheet" href="css/figures.css">
  <link rel="stylesheet" href="css/layers.css">
</head>
<body>
  <div class="deck" id="deck">
    <div class="backdrop" aria-hidden="true"><div class="backdrop-track" id="backdrop-track"></div></div>
    <main class="track" id="track"></main>
  </div>

  <header class="chrome-top">
    <p class="where"><span class="num" id="where-num">0</span><span class="label" id="where-title"></span></p>
    <div class="chrome-actions">
      <button type="button" class="icon-btn" id="restart" title="Back to the first slide (Home)">Start over</button>
      <button type="button" class="icon-btn" id="menu-open" aria-controls="menu">Slides</button>
      <button type="button" class="icon-btn" id="full" title="Full screen (F)">Full screen</button>
    </div>
  </header>

  <footer class="chrome-bottom">
    <div class="progress" id="progress" aria-hidden="true"></div>
    <div class="nav">
      <button type="button" class="icon-btn" id="prev" aria-label="Back">Back</button>
      <span class="count" id="count" aria-live="polite"></span>
      <button type="button" class="icon-btn" id="next" aria-label="Next">Next</button>
    </div>
  </footer>

  <nav class="menu" id="menu" hidden aria-label="All slides">
    <h2>Chapters</h2>
    <ol id="menu-list"></ol>
    <button type="button" class="icon-btn close" id="menu-close">Close</button>
  </nav>

  <noscript><p>This presentation needs JavaScript. The full text is in the project’s <code>content/story.md</code>.</p></noscript>

  <script src="js/slides-a.js"></script>
  <script src="js/tool-catalog.js"></script>
  <script src="js/steps.js"></script>
  <script src="js/slides-b.js"></script>
  <script src="js/deck.js"></script>
  <script src="js/hud-preview.js"></script>
  <script src="js/hud-intro.js"></script>
  <script src="js/hud-actions.js"></script>
  <script src="js/conversation-type.js"></script>
  <script src="js/tally.js"></script>
  <script src="js/pull.js"></script>
  <script src="js/typing.js"></script>
  <script src="js/vendor/qrcode.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/resource-qr.js"></script>
</body>
</html>
